<section class="slide t-ink l-stack" data-slide="7" data-title="Scale traffic, Scale năng lực" id="s07">
  <style>
    #s07{ justify-content:center; gap:0; }

    #s07 .band{ display:flex; align-items:flex-end; gap:120px; flex:none; }
    #s07 .ttl{
      margin:0; font-size:172px; font-weight:900; line-height:1; letter-spacing:-.04em;
      flex:1 1 auto; min-width:0;
    }
    #s07 .ttl b{ color:var(--accent); font-weight:900; }
    #s07 .band .cue{
      flex:0 0 auto; margin:0 0 18px; font-family:var(--mono); font-size:29px; font-weight:600;
      letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
      display:flex; align-items:center; gap:20px;
    }
    #s07 .band .cue i{ display:block; width:58px; height:3px; background:var(--accent); flex:none; }

    /* four nodes reading left to right, joined by arrows: traffic grows, and
       each answer to it creates the next pressure */
    #s07 .chain{ display:flex; align-items:stretch; margin-top:104px; flex:none; }

    #s07 .node2{
      flex:1; min-width:0; background:var(--card); border:2px solid var(--card-line);
      border-top:6px solid var(--accent); border-radius:0 0 22px 22px;
      min-height:376px; padding:38px 36px 42px; display:flex; flex-direction:column; gap:24px;
    }
    #s07 .node2 .n{
      margin:0; font-family:var(--mono); font-size:30px; font-weight:600;
      letter-spacing:.18em; color:var(--accent);
    }
    #s07 .node2 .t{
      margin:auto 0 0; font-size:56px; font-weight:700; line-height:1.2; letter-spacing:-.018em;
    }
    /* the last node is the conventional answer — it costs money and time, which
       is the tension the next slide resolves */
    #s07 .node2.last{ border-top-color:var(--amber); }
    #s07 .node2.last .n{ color:var(--amber); }

    #s07 .arw{
      flex:0 0 96px; position:relative; align-self:center; height:6px;
      background:var(--hair);
    }
    #s07 .arw::after{
      content:""; position:absolute; right:-2px; top:50%; transform:translateY(-50%);
      width:0; height:0; border:19px solid transparent;
      border-left-color:var(--accent); border-right:0;
    }
  </style>

  <div class="deco">
    <div class="deco-grid"></div>
    <div class="deco-orb" style="right:-760px; bottom:-1180px; opacity:.14;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="meta">Phần 01 <b>·</b> Áp lực vận hành</p>

  <div class="band">
    <h1 class="ttl">
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="180" data-dur="940">Scale traffic, <b>Scale năng lực</b></span></span>
    </h1>
    <p class="cue" data-anim="up-sm" data-delay="420"><i></i>Khách tăng thì áp lực tăng theo</p>
  </div>

  <div class="chain">
    <div class="node2" data-anim="up-sm" data-delay="620">
      <p class="n">01</p>
      <p class="t">Inbox nổ nhanh hơn khả năng phản hồi, tư vấn thủ công</p>
    </div>
    <i class="arw" data-anim="grow-x" data-delay="760" data-dur="380"></i>

    <div class="node2" data-anim="up-sm" data-delay="820">
      <p class="n">02</p>
      <p class="t">Sản phẩm nhiều, tư vấn lặp lại tốn thời gian</p>
    </div>
    <i class="arw" data-anim="grow-x" data-delay="960" data-dur="380"></i>

    <div class="node2" data-anim="up-sm" data-delay="1020">
      <p class="n">03</p>
      <p class="t">Tăng traffic, tăng áp lực vận hành</p>
    </div>
    <i class="arw" data-anim="grow-x" data-delay="1160" data-dur="380"></i>

    <div class="node2 last" data-anim="up-sm" data-delay="1220">
      <p class="n">04</p>
      <p class="t">Tuyển thêm nhân sự, đào tạo</p>
    </div>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
