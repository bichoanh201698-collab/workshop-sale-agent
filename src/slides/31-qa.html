<section class="slide t-paper" data-slide="31" data-title="Q&amp;A — tham gia cộng đồng" id="s31">
  <style>
    #s31{ gap:140px; align-items:center; justify-content:center; }

    #s31 .lz{ flex:0 0 auto; display:flex; flex-direction:column; gap:40px; }
    #s31 .qa{ margin:0; font-size:336px; font-weight:900; letter-spacing:-.055em; line-height:.86; }
    #s31 .lz p.t{ margin:0; font-size:44px; line-height:1.32; color:var(--muted); max-width:24ch; }
    #s31 .lz p.t b{ color:var(--fg); font-weight:700; }

    #s31 .rz{ flex:0 0 auto; display:flex; flex-direction:column; gap:44px; }
    #s31 .rule{ flex:none; align-self:stretch; width:3px; background:var(--hair);
      margin:132px 0; transform-origin:center top; }

    #s31 .hd{ display:flex; align-items:center; gap:26px; border-bottom:3px solid var(--hair); padding-bottom:26px; }
    #s31 .hd h2{ margin:0; font-size:72px; font-weight:800; letter-spacing:-.02em; }
    #s31 .hd i{ display:block; width:80px; height:5px; background:var(--accent); flex:none; }

    /* Two codes, both real. They no longer need to stretch to the far edge —
       a fixed gap keeps the pair inside one eye fixation. */
    #s31 .codes{ display:flex; gap:120px; align-items:flex-start; justify-content:center; }
    /* Both codes now sit in an identical crimson frame. qr-zalo.png shipped with
       a red frame baked into the bitmap, which made the pair look mismatched, so
       it was stripped and the code rebuilt on a clean white canvas. */
    #s31 .codes .qr img{
      width:404px; height:404px; display:block; background:#fff;
      border:8px solid var(--brand); border-radius:26px; box-sizing:border-box;
      padding:14px;
    }
    #s31 .codes .qr span{ color:var(--fg); font-size:31px; }
  </style>

  <div class="deco">
    <div class="deco-dots" style="opacity:.45;"></div>
    <div class="deco-orb" style="right:-880px; bottom:-1260px; opacity:.10;"></div>
  </div>

  <p class="meta">Hỏi đáp <b>·</b> Thảo luận tự do</p>

  <div class="lz">
    <p class="label" data-anim="wipe-r" data-delay="120">Session 05</p>
    <h1 class="qa">
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="240" data-dur="980">Q&amp;A</span></span>
    </h1>
    <p class="t" data-anim="up-sm" data-delay="560">Hỏi đáp &amp; <b>thảo luận tự do</b> — cứ hỏi thẳng về shop của mình.</p>
  </div>

  <i class="rule" data-anim="grow-y" data-delay="440" data-dur="820"></i>

  <div class="rz">
    <div class="hd" data-anim="up-sm" data-delay="660">
      <i></i>
      <h2>Tham gia cộng đồng</h2>
    </div>

    <div class="codes">
      <div class="qr" data-anim="up-sm" data-delay="820">
        <img src="assets/brand/qr-zalo-community.png" alt="Mã QR cộng đồng AI Agents Việt Nam">
        <span>Cộng đồng AI Agents Việt Nam</span>
      </div>
      <div class="qr" data-anim="up-sm" data-delay="940">
        <img src="assets/brand/qr-zalo-group-saleagent.png" alt="Mã QR nhóm Zalo ClawExperts — Sale Agent">
        <span>Cộng đồng Sale Agent</span>
      </div>
    </div>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
