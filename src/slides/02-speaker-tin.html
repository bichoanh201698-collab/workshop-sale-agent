<section class="slide t-ink" data-slide="2" data-title="Speaker — Tín Trương" id="s02">
  <style>
    /* Rebuilt from the client's speaker card (docs/ref/ref-02-speaker-card.png).
       Their card is 552px square, so blowing it up on a 4480px wall would be
       soft. The portrait is used at close to native size and the pill, frame
       and name band are rebuilt live, with the name moved out to carry the
       left half of the stage instead of being repeated twice. */
    #s02{ align-items:center; justify-content:center; gap:130px; }

    #s02 .lz{ flex:0 0 auto; display:flex; flex-direction:column; gap:44px; }
    #s02 .nm{
      margin:0; font-size:252px; font-weight:900; letter-spacing:-.042em; line-height:.94;
    }
    #s02 .roles{ display:flex; flex-direction:column; gap:26px; }
    #s02 .roles p{
      margin:0; display:flex; align-items:center; gap:26px;
      font-size:54px; font-weight:700; letter-spacing:-.016em;
    }
    #s02 .roles p svg{ width:52px; height:52px; flex:none; stroke:var(--accent); }
    #s02 .roles p.sub{ font-size:52px; font-weight:500; color:var(--muted); }

    /* --- the card ---------------------------------------------------- */
    #s02 .rule{ flex:none; align-self:stretch; width:3px; background:var(--hair);
      margin:150px 0; transform-origin:center top; }

    /* Portrait card: the client's half-body cutout (transparent PNG) stands
       on the red ground, anchored to the bottom edge so the frame reads as a
       proper speaker card. The name lives large on the left, so the card
       carries only the client's "Speakers" pill — repeating the name in a
       band as their 552px card does would say it twice on one stage. */
    #s02 .card2{
      flex:none; width:640px; height:790px; position:relative;
      border-radius:56px; background:#A10808;
      box-shadow:0 0 0 7px var(--brand), 0 0 110px -12px #E61F28AA, 0 54px 130px -44px #000000CC;
    }
    #s02 .card2 .ph{
      position:absolute; inset:0; border-radius:56px; overflow:hidden; display:block;
    }
    #s02 .card2 img{
      /* 97%, not 100+%: at full height the crop's top padding disappears and
         the hair clips against the card edge. */
      position:absolute; left:50%; bottom:0; transform:translateX(-50%);
      height:97%; width:auto; display:block;
    }
    #s02 .card2 .pill{
      position:absolute; left:50%; bottom:-34px; transform:translateX(-50%);
      z-index:3; white-space:nowrap;
      background:#08080A; color:#fff; border:5px solid var(--brand);
      border-radius:999px; padding:22px 66px;
      font-size:52px; font-weight:800; letter-spacing:-.01em;
      box-shadow:0 0 40px -4px #E61F28CC;
    }
    /* slow shine crawling across the frame */
    #s02 .card2 .ph::after{
      content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
      background:linear-gradient(115deg, transparent 34%, #FFFFFF1F 47%, #FFFFFF4D 50%, #FFFFFF1F 53%, transparent 66%);
      transform:translateX(-120%);
      animation:s02shine 7.5s cubic-bezier(.4,0,.6,1) infinite;
    }
    @keyframes s02shine{
      0%{ transform:translateX(-120%) } 62%{ transform:translateX(120%) } 100%{ transform:translateX(120%) }
    }
  </style>

  <div class="deco">
    <div class="deco-grid"></div>
    <div class="deco-orb" style="right:-560px; top:-980px; opacity:.17;"></div>
    <div class="deco-orb" style="left:-840px; bottom:-1240px; opacity:.09;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="meta">Speaker</p>

  <div class="lz">
    <p class="label" data-anim="wipe-r" data-delay="140">Speakers</p>
    <h1 class="nm">
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="300" data-dur="1000">Tín Trương</span></span>
    </h1>
    <div class="roles">
      <p data-anim="up-sm" data-delay="640">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Lead Producer — AI Agent Business Solutions
      </p>
      <p class="sub" data-anim="up-sm" data-delay="740">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        ClawExperts.com
      </p>
    </div>
  </div>

  <i class="rule" data-anim="grow-y" data-delay="420" data-dur="800"></i>

  <div class="card2" data-anim="scale" data-delay="480" data-dur="1000">
    <span class="ph"><img src="assets/brand/speaker-tin-halfbody.png" alt="Tín Trương"></span>
    <span class="pill">Speakers</span>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
