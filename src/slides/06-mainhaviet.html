<section class="slide t-ink l-stack" data-slide="6" data-title="Mái Nhà Việt x3 năng suất — 3 kết quả" id="s06">
  <style>
    #s06{ gap:76px; }

    #s06 .band{ display:flex; align-items:flex-end; }
    #s06 .band .say{ flex:1; min-width:0; display:flex; flex-direction:column; gap:32px; }
    #s06 .hd{ margin:0; font-size:146px; font-weight:900; letter-spacing:-.034em; line-height:1.06; white-space:nowrap; }


    #s06 .strip{ display:flex; align-items:flex-start; }
    #s06 .strip > .stat{ flex:1; min-width:0; padding:0 70px; gap:30px; }
    #s06 .strip > .stat:first-child{ padding-left:0; }
    #s06 .strip > .stat:last-child{ padding-right:0; }
    #s06 .strip > .stat + .stat{ border-left:3px solid var(--hair); }
    /* .stat .num is a <p> here; theme.css already zeroes the margin, but a
       1em margin at 300px would blow the 1120px canvas — keep it explicit. */
    #s06 .stat .num{ font-size:288px; margin:0; }
    #s06 .stat .cap{ max-width:1210px; font-size:44px; color:var(--muted); }
    #s06 .stat .cap b{ color:var(--fg); font-weight:800; }

    /* ---- before → after variant of .stat ------------------------------
       The first figure is a transition (47m25s → 6s), not a fraction, so
       .num carries two values at different weights plus a handoff arrow
       instead of the .den suffix the component was built for. */
    #s06 .stat.ba .num{ gap:34px; align-items:flex-end; }
    /* each value carries its own label so "Sau" sits under 6s, not next to Trước */
    #s06 .stat.ba .col{ display:flex; flex-direction:column; align-items:flex-start; gap:12px; }
    #s06 .stat.ba .col .tag{
      font-family:var(--mono); font-size:25px; font-weight:600;
      letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
    }
    #s06 .stat.ba .col.now-col .tag{ color:var(--accent); }
    #s06 .stat.ba .was{
      font-size:122px; font-weight:800; color:var(--muted);
      letter-spacing:-.025em; line-height:.82;
    }
    #s06 .stat.ba .now{ line-height:.82; }
    #s06 .stat.ba .to{
      position:relative; flex:none;
      width:118px; height:9px; background:var(--hair); margin:0 8px 106px;
    }
    #s06 .stat.ba .to::after{
      content:""; position:absolute; right:-2px; top:50%; transform:translateY(-50%);
      width:0; height:0; border:25px solid transparent;
      border-left-color:var(--accent); border-right:0;
    }
  </style>

  <div class="deco">
    <div class="deco-grid"></div>
    <div class="deco-orb amber" style="left:1240px; top:-1300px; opacity:.10;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="meta">Phần 01 <b>·</b> Case study</p>

  <div class="band">
    <div class="say">
      <p class="label" data-anim="wipe-r" data-delay="120">Case study <b>·</b> Mái Nhà Việt</p>
      <h1 class="hd" data-anim="up-sm" data-delay="260">
        Doanh nghiệp Mái Nhà Việt <span class="ac">x3 năng suất</span>
      </h1>
    </div>
  </div>

  <div class="strip">
    <div class="stat a ba" data-anim="up-sm" data-delay="620">
      <p class="num">
        <span class="col"><span class="was">47m25s</span><span class="tag">Trước</span></span>
        <i class="to"></i>
        <span class="col now-col"><span class="now">6s</span><span class="tag">Sau</span></span>
      </p>
      <p class="cap">thời gian trung bình <b>1 khách hàng được trả lời</b></p>
    </div>

    <div class="stat b" data-anim="up-sm" data-delay="760">
      <p class="num">600+</p>
      <p class="cap"><b>khách hàng được tư vấn</b> xuyên suốt dịp lễ 1–2/9</p>
    </div>

    <div class="stat c" data-anim="up-sm" data-delay="900">
      <p class="num">85%<span class="den">&nbsp;/ 15%</span></p>
      <p class="cap">lọc <b>85%</b> không quan tâm · bàn giao <b>15%</b> có nhu cầu</p>
    </div>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
</section>
