    /* ------------------------------------------------------------------
       Slide 19 — conceptual org chart, three tiers.
       The client's reference art is 16:9, so the tiers were deep and the
       chart was centred. On 4:1 the headline takes the left third and the
       diagram the right two thirds, and each tier is re-cut WIDE + SHALLOW
       (912px of height has to hold three tiers plus two connector zones).
       Every coordinate below is local to .dg (2720 x 912).
       ------------------------------------------------------------------ */
    #s19{ align-items:center; gap:130px; }

    #s19 .lead{ flex:1; min-width:0; display:flex; flex-direction:column; gap:46px; }
    #s19 .ttl{
      margin:0; font-size:130px; font-weight:900;
      letter-spacing:-.032em; line-height:1.05; text-wrap:balance;
    }
    #s19 .lead .sm{ max-width:20ch; }

    #s19 .dg{
      flex:none; width:2720px; height:912px; position:relative;
      /* The foundation tier ended exactly on the safe-area edge, where the
         .ribbon pill sits. Scale the whole chart from its top so the internal
         geometry stays exact and the bottom tier clears the furniture. */
      transform:scale(.93); transform-origin:top center;
    }
    #s19 .lay{ position:absolute; inset:0; }

    /* thicker rules than the 3px default — 3px vanishes on an LED wall */
    #s19 .conn.h{ height:5px; margin-top:-2.5px; }
    #s19 .conn.v{ width:5px;  margin-left:-2.5px; }
    #s19 .ah{
      position:absolute; width:0; height:0; margin-left:-18px;
      border:18px solid transparent; border-top-color:var(--forest); border-bottom:0;
    }

    #s19 .node{ position:absolute; box-shadow:0 20px 48px -34px #0A0B0D3D; }

    /* tier 1 — the human owner. The ONLY crimson on this slide. */
    #s19 .owner{ left:1010px; top:0; width:700px; height:152px; border-width:4px; }
    #s19 .owner .hd{
      height:100%; display:flex; align-items:center; justify-content:center;
      gap:30px; font-size:54px; padding:0 40px; line-height:1.14; letter-spacing:-.01em;
    }
    #s19 .owner svg{ width:66px; height:66px; flex:none; }

    /* tier 2 — four equal digital roles, icon over label */
    #s19 .role{ top:372px; width:650px; height:250px; }
    #s19 .role .ic{ flex:1; display:grid; place-items:center; color:var(--forest); }
    #s19 .role .ic svg{ width:116px; height:116px; }
    #s19 .role .hd{ font-size:44px; padding:20px 24px; line-height:1.14; letter-spacing:-.008em; }

    /* tier 3 — the shared working platform: solid plates, icon beside label */
    #s19 .found{
      top:762px; height:150px; width:880px;
      flex-direction:row; align-items:center; gap:34px; padding:0 46px;
      background:var(--forest); border-color:var(--forest); color:#fff;
    }
    #s19 .found svg{ width:76px; height:76px; flex:none; }
    #s19 .found .t{ font-size:46px; font-weight:700; letter-spacing:-.014em; line-height:1.1; }
  </style>
