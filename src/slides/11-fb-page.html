<section class="slide t-ink" data-slide="11" data-title="Quét mã — Facebook page" id="s11">
  <style>
    /* The QR is the whole point of this slide, so it sits dead centre and the
       two text zones balance it left and right across the 4:1 stage. */
    #s11{ align-items:center; gap:150px; }

    #s11 .lz{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:40px; }
    #s11 .lz h1{ margin:0; font-size:158px; font-weight:900; letter-spacing:-.034em; line-height:1.07; }

    #s11 .plate{
      flex:none; position:relative; width:600px; height:600px; border-radius:42px;
      background:#fff; padding:40px; box-sizing:border-box;
      box-shadow:0 0 0 8px var(--accent), 0 40px 110px -28px #E61F28AA;
      overflow:hidden;
    }
    #s11 .plate img{ width:100%; height:100%; display:block; object-fit:contain; }
    /* the one moving thing on the slide */
    #s11 .plate .scan{
      position:absolute; left:0; right:0; height:160px; pointer-events:none;
      background:linear-gradient(to bottom,#E61F2800,#E61F2830 45%,#E61F28CC 50%,#E61F2830 55%,#E61F2800);
      animation:s10scan 3.4s cubic-bezier(.45,0,.55,1) infinite;
    }
    @keyframes s10scan{
      0%{ transform:translateY(-160px); opacity:0 }
      12%{ opacity:1 } 88%{ opacity:1 }
      100%{ transform:translateY(600px); opacity:0 }
    }

    #s11 .rz{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:34px; }
    #s11 .rz .big{
      margin:0; font-size:80px; font-weight:800; letter-spacing:-.02em; line-height:1.14; max-width:20ch;
    }
    #s11 .rz .steps2{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:20px; }
    #s11 .rz .steps2 li{
      display:flex; align-items:baseline; gap:22px;
      font-family:var(--mono); font-size:33px; font-weight:600; letter-spacing:.06em;
      text-transform:uppercase; color:var(--muted);
    }
    #s11 .rz .steps2 li b{ color:var(--accent); font-weight:600; }
    #s11 .tag{
      display:inline-flex; align-items:center; gap:20px; align-self:flex-start;
      background:var(--accent); color:#fff; border-radius:999px; padding:20px 40px;
      font-size:46px; font-weight:800; letter-spacing:-.012em;
    }
  </style>

  <div class="deco">
    <div class="deco-grid"></div>
    <div class="deco-orb" style="left:50%; top:-1180px; margin-left:-900px; opacity:.17;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="meta">Trước hands-on <b>·</b> Facebook page</p>

  <div class="lz">
    <p class="label bare" style="letter-spacing:.3em;" data-anim="wipe-r" data-delay="120">Trước khi vào hands-on</p>
    <h1>
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="280" data-dur="960">Quét mã để</span></span>
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="380" data-dur="960">theo dõi <span class="ac">Facebook page</span></span></span>
    </h1>
  </div>

  <div class="plate" data-anim="scale" data-delay="600" data-dur="900">
    <img src="assets/brand/qr-facebook-page.png" alt="Mã QR Facebook page">
    <span class="scan"></span>
  </div>

  <div class="rz">
    <span class="tag" data-anim="up-sm" data-delay="880"><span class="pulse"><i></i></span>Facebook page</span>
    <p class="big" data-anim="up-sm" data-delay="980">Mở camera điện thoại và quét mã bên cạnh.</p>
    <ul class="steps2">
      <li data-anim="up-sm" data-delay="1100"><b>01</b>Mở camera</li>
      <li data-anim="up-sm" data-delay="1180"><b>02</b>Hướng vào mã QR</li>
      <li data-anim="up-sm" data-delay="1260"><b>03</b>Mở link và theo dõi page</li>
    </ul>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
