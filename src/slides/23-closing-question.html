<section class="slide t-accent l-center" data-slide="23" data-title="Bạn đã có nhân viên số đầu tiên. Bạn muốn xây đội ngũ nào tiếp theo?" id="s23">
  <style>
    /* Client art direction: two large lines, generous emptiness so the
       question carries weight, accent on "đội ngũ", line one first then a
       beat before the question, and nothing added — no image, no new idea.
       On t-accent --accent resolves to white, so the accent on "đội ngũ" is
       carried by an inverted white plate (crimson type on white). */
    #s23{ gap:0; }

    #s23 .say{ margin:0; font-weight:900; letter-spacing:-.038em; white-space:nowrap; }
    #s23 .one{ font-size:186px; line-height:1.06; }
    #s23 .two{ font-size:230px; line-height:1.08; margin-top:138px; letter-spacing:-.042em; }

    /* the plate has to clear the circumflex on ộ and the tilde on ũ above,
       and the dot below ộ underneath */
    #s23 .hl.fill .hl-bar{ top:-.15em; bottom:-.13em; border-radius:10px; }
    #s23 .hl.fill{ padding:0 .07em; }
  </style>

  <div class="deco">
    <div class="deco-dots" style="opacity:.26;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="say one">
    <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="140" data-dur="880">Bạn đã có nhân viên số đầu tiên.</span></span>
  </p>

  <p class="say two" data-anim="up-sm" data-delay="900" data-dur="880">
    Bạn muốn xây <em class="hl fill">đội ngũ<i class="hl-bar"></i></em> nào tiếp theo?
  </p>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="OpenClaw VN">
    <i class="sep"></i>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
