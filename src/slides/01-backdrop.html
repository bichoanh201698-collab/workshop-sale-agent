<section class="slide t-ink" data-slide="1" data-title="Backdrop — check-in" id="s01">
  <style>
    /* Slide 0: the wall behind check-in, laid out the way a real event backdrop
       is — partner marks tiled down both sides, the event lockup in the middle.
       The title is the SAME asset the cover uses, so the room sees one identity
       from the moment they walk in. Nothing here is meant to be read from the
       back; the side walls are texture. */
    #s01{ padding:0; overflow:hidden; align-items:center; justify-content:center; }

    /* --- ground ------------------------------------------------------- */
    #s01 .bg{ position:absolute; inset:0; z-index:-3; overflow:hidden; }
    #s01 .bg-base{
      position:absolute; inset:0;
      background:
        radial-gradient(2300px 1500px at 50% 48%, #7A0A12 0%, #3A050A 34%, #140406 64%, #08080A 100%),
        linear-gradient(180deg, #0B0B0E 0%, #120609 55%, #0A0A0C 100%);
    }
    #s01 .bloom{
      position:absolute; left:50%; top:50%; width:3200px; height:2000px;
      margin:-1000px 0 0 -1600px; border-radius:50%;
      background:radial-gradient(closest-side, #FF1A2673 0%, #C4101C3D 42%, transparent 72%);
      filter:blur(60px);
      animation:s01breathe 13s ease-in-out infinite alternate;
    }
    @keyframes s01breathe{
      from{ transform:scale(1); opacity:.6; }
      to  { transform:scale(1.09); opacity:.9; }
    }
    #s01 .scrim{
      position:absolute; left:50%; top:50%; width:2600px; height:1160px;
      margin:-580px 0 0 -1300px;
      background:radial-gradient(closest-side, #0A0508E0 0%, #0A0508A6 46%, transparent 76%);
    }
    #s01 .vig{
      position:absolute; inset:0;
      background:radial-gradient(2000px 1050px at 50% 50%, transparent 28%, #000000B3 100%);
    }

    /* --- the tiled partner walls -------------------------------------- */
    #s01 .wall{
      position:absolute; top:-90px; bottom:-90px; width:1010px;
      display:flex; flex-direction:column; justify-content:space-between;
      z-index:-2; pointer-events:none;
      will-change:transform;
    }
    #s01 .wall.left { left:96px;  animation:s01wallA 40s ease-in-out infinite alternate; }
    #s01 .wall.right{ right:96px; animation:s01wallB 40s ease-in-out infinite alternate; }
    @keyframes s01wallA{ from{ transform:translate3d(0,0,0) } to{ transform:translate3d(0,-46px,0) } }
    @keyframes s01wallB{ from{ transform:translate3d(0,-46px,0) } to{ transform:translate3d(0,0,0) } }

    #s01 .wr{ display:flex; justify-content:space-between; align-items:center; }
    #s01 .mk{ display:block; }
    /* the marks are dark artwork; silhouetting them keeps one flat tone so the
       wall reads as texture rather than as a row of competing logos */
    #s01 .mk img{
      display:block; height:62px; width:auto;
      filter:brightness(0) invert(1);
      opacity:.14;
    }

    /* --- the legible centre ------------------------------------------- */
    #s01 .plate{
      position:relative; z-index:1;
      display:flex; flex-direction:column; align-items:center;
    }
    #s01 .partners{ width:1100px; height:auto; display:block; }
    #s01 .badge{ width:400px; height:auto; display:block; margin-top:40px; }
    #s01 .title{
      width:2000px; height:auto; display:block; margin-top:26px;
      filter:drop-shadow(0 28px 70px #000000A6);
    }
  </style>
