<section class="slide t-ink" data-slide="21" data-title="Speaker — Hoàng Lê" id="s21">
  <style>
    /* Same construction as slide 02 (Tín Trương) so the two speaker slides
       read as a pair: centred name/role + hairline + portrait card. */
    #s21{ align-items:center; justify-content:center; gap:130px; }

    #s21 .lz{ flex:0 0 auto; display:flex; flex-direction:column; gap:44px; }
    #s21 .nm{
      margin:0; font-size:252px; font-weight:900; letter-spacing:-.042em; line-height:.94;
    }
    #s21 .roles{ display:flex; flex-direction:column; gap:26px; }
    #s21 .roles p{
      margin:0; display:flex; align-items:center; gap:26px;
      font-size:54px; font-weight:700; letter-spacing:-.016em;
    }
    #s21 .roles p svg{ width:52px; height:52px; flex:none; stroke:var(--accent); }

    #s21 .rule{ flex:none; align-self:stretch; width:3px; background:var(--hair);
      margin:150px 0; transform-origin:center top; }

    #s21 .card2{
      flex:none; width:640px; height:790px; position:relative;
      border-radius:56px; background:#A10808;
      box-shadow:0 0 0 7px var(--brand), 0 0 110px -12px #E61F28AA, 0 54px 130px -44px #000000CC;
    }
    #s21 .card2 .ph{
      position:absolute; inset:0; border-radius:56px; overflow:hidden; display:block;
    }
    /* his crop is a wider frame than Tín's (0.79 vs 0.66), so it is sized to
       84% of card height — that lands his head at the same size as Tín's and
       keeps a comfortable red margin at the sides. */
    #s21 .card2 img{
      position:absolute; left:50%; bottom:0; transform:translateX(-50%);
      height:84%; width:auto; display:block;
    }
    #s21 .card2 .pill{
      position:absolute; left:50%; bottom:-34px; transform:translateX(-50%);
      z-index:3; white-space:nowrap;
      background:#08080A; color:#fff; border:5px solid var(--brand);
      border-radius:999px; padding:22px 66px;
      font-size:52px; font-weight:800; letter-spacing:-.01em;
      box-shadow:0 0 40px -4px #E61F28CC;
    }
    #s21 .card2 .ph::after{
      content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
      background:linear-gradient(115deg, transparent 34%, #FFFFFF1F 47%, #FFFFFF4D 50%, #FFFFFF1F 53%, transparent 66%);
      transform:translateX(-120%);
      animation:s18shine 7.5s cubic-bezier(.4,0,.6,1) infinite;
    }
    @keyframes s18shine{
      0%{ transform:translateX(-120%) } 62%{ transform:translateX(120%) } 100%{ transform:translateX(120%) }
    }
  </style>

  <div class="deco">
    <div class="deco-grid"></div>
    <div class="deco-orb" style="right:-560px; top:-980px; opacity:.17;"></div>
    <div class="deco-orb" style="left:-840px; bottom:-1240px; opacity:.09;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="meta">Speaker</p>

  <div class="lz">
    <p class="label" data-anim="wipe-r" data-delay="140">Speakers</p>
    <h1 class="nm">
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="300" data-dur="1000">Hoàng Lê</span></span>
    </h1>
    <div class="roles">
      <p data-anim="up-sm" data-delay="640">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Program Manager — AI Agent Business Solution
      </p>
    </div>
  </div>

  <i class="rule" data-anim="grow-y" data-delay="420" data-dur="800"></i>

  <div class="card2" data-anim="scale" data-delay="480" data-dur="1000">
    <span class="ph"><img src="assets/brand/speaker-hoang-halfbody.png" alt="Hoàng Lê"></span>
    <span class="pill">Speakers</span>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
