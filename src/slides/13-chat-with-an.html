<section class="slide t-ink" data-slide="13" data-title="Chat với An — nhân viên tư vấn trái cây và mâm ngũ quả" id="s13">
  <style>
    /* Two elements only, so they sit as one centred pair with a hairline
       between them — the same recipe as the speaker slide. Anchoring each
       to its own safe edge would leave a hole in the middle of a 4:1 stage. */
    #s13{ align-items:center; justify-content:center; gap:150px; }

    #s13 .lz{ flex:0 0 auto; display:flex; flex-direction:column; gap:46px; }
    #s13 .lz h1{
      margin:0; font-size:168px; font-weight:900; letter-spacing:-.038em; line-height:1.1;
    }

    #s13 .rule{ flex:none; align-self:stretch; width:3px; background:var(--hair);
      margin:118px 0; transform-origin:center top; }

    #s13 .plate{
      flex:none; position:relative; width:660px; height:660px; border-radius:44px;
      background:#fff; padding:44px; box-sizing:border-box;
      box-shadow:0 0 0 8px var(--brand), 0 44px 120px -30px #E61F28AA;
      overflow:hidden;
    }
    #s13 .plate img{ width:100%; height:100%; display:block; object-fit:contain; }
    #s13 .plate .scan{
      position:absolute; left:0; right:0; height:170px; pointer-events:none;
      background:linear-gradient(to bottom,#E61F2800,#E61F2830 45%,#E61F28CC 50%,#E61F2830 55%,#E61F2800);
      animation:s11scan 3.4s cubic-bezier(.45,0,.55,1) infinite;
    }
    @keyframes s11scan{
      0%{ transform:translateY(-170px); opacity:0 }
      12%{ opacity:1 } 88%{ opacity:1 }
      100%{ transform:translateY(660px); opacity:0 }
    }
  </style>

  <div class="deco">
    <div class="deco-grid"></div>
    <div class="deco-orb" style="left:50%; margin-left:-940px; top:-1180px; opacity:.16;"></div>
    <div class="deco-noise"></div>
  </div>

  <p class="meta">Trước hands-on</p>

  <div class="lz">
    <p class="label" data-anim="wipe-r" data-delay="120">Trước khi vào hands-on</p>
    <h1>
      <span class="mask"><span style="display:block; white-space:nowrap" data-anim="mask-up" data-delay="280" data-dur="980">Chat với <span class="ac">An</span>, nhân viên tư vấn</span></span>
      <span class="mask"><span style="display:block; white-space:nowrap" data-anim="mask-up" data-delay="390" data-dur="980">trái cây và mâm ngũ quả</span></span>
    </h1>
  </div>

  <i class="rule" data-anim="grow-y" data-delay="480" data-dur="820"></i>

  <div class="plate" data-anim="scale" data-delay="560" data-dur="960">
    <img src="assets/brand/qr-facebook-page.png" alt="Mã QR để chat với An">
    <span class="scan"></span>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
