<section class="slide t-paper" data-slide="25" data-title="Q&amp;A — tham gia cộng đồng" id="s25">
  <style>
    #s25{ gap:150px; align-items:center; }

    #s25 .lz{ flex:0 0 1500px; display:flex; flex-direction:column; gap:40px; }
    #s25 .qa{ margin:0; font-size:336px; font-weight:900; letter-spacing:-.055em; line-height:.86; }
    #s25 .lz p.t{ margin:0; font-size:44px; line-height:1.32; color:var(--muted); max-width:24ch; }
    #s25 .lz p.t b{ color:var(--fg); font-weight:700; }

    #s25 .rz{ flex:1; min-width:0; display:flex; flex-direction:column; gap:46px; }
    #s25 .hd{ display:flex; align-items:center; gap:26px; border-bottom:3px solid var(--hair); padding-bottom:26px; }
    #s25 .hd h2{ margin:0; font-size:72px; font-weight:800; letter-spacing:-.02em; }
    #s25 .hd i{ display:block; width:80px; height:5px; background:var(--accent); flex:none; }

    #s25 .codes{ display:flex; gap:60px; align-items:flex-start; justify-content:space-between; }
    #s25 .codes .qr img{ width:322px; border:3px solid #0A0B0D14; }
    #s25 .codes .qr span{ color:var(--fg); font-size:29px; }

    /* the client lists three communities but shipped two codes — show the gap, don't hide it */
    #s25 .todo{
      width:322px; height:322px; border-radius:22px; border:4px dashed #0A0B0D33;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:14px; text-align:center; padding:22px;
    }
    #s25 .todo b{ font-size:60px; font-weight:900; color:#0A0B0D2E; line-height:1; }
    #s25 .todo em{
      font-style:normal; font-family:var(--mono); font-size:22px; font-weight:600;
      letter-spacing:.1em; color:var(--muted); line-height:1.4;
    }
  </style>

  <div class="deco">
    <div class="deco-dots" style="opacity:.45;"></div>
    <div class="deco-orb" style="right:-880px; bottom:-1260px; opacity:.10;"></div>
  </div>

  <p class="meta">Hỏi đáp <b>·</b> Thảo luận tự do</p>

  <div class="lz">
    <p class="label" data-anim="wipe-r" data-delay="120">Session 05</p>
    <h1 class="qa">
      <span class="mask"><span style="display:block" data-anim="mask-up" data-delay="240" data-dur="980">Q&amp;A</span></span>
    </h1>
    <p class="t" data-anim="up-sm" data-delay="560">Hỏi đáp &amp; <b>thảo luận tự do</b> — cứ hỏi thẳng về shop của mình.</p>
  </div>

  <div class="rz">
    <div class="hd" data-anim="up-sm" data-delay="660">
      <i></i>
      <h2>Tham gia cộng đồng</h2>
    </div>

    <div class="codes">
      <div class="qr" data-anim="up-sm" data-delay="820">
        <img src="assets/brand/qr-zalo.png" alt="Mã QR cộng đồng Zalo">
        <span>Cộng đồng Zalo</span>
      </div>
      <div class="qr" data-anim="up-sm" data-delay="920">
        <img src="assets/brand/qr-facebook.png" alt="Mã QR cộng đồng Facebook">
        <span>Cộng đồng Facebook</span>
      </div>
      <div class="qr" data-anim="up-sm" data-delay="1020">
        <div class="todo"><b>?</b><em>Mã QR<br>chưa có</em></div>
        <span>Cộng đồng Sale Agent</span>
      </div>
    </div>
  </div>

  <div class="brandbar">
    <img src="assets/brand/logo-organizer-openclaw.png" alt="Đơn vị tổ chức — OpenClaw VN">
    <span class="sep"></span>
    <img src="assets/brand/logo-sponsor-clawexperts.png" alt="Đơn vị tài trợ — ClawExperts.com">
  </div>
  <p class="ribbon"><span class="dot"></span>Sale Agent Event</p>
</section>
