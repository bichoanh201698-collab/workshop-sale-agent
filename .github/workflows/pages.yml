# Publishes the repo as-is. The deck is a hand-built static site: index.html is
# generated by build.sh and every asset is a plain file, so nothing should run a
# site generator over it. The legacy Pages builder kept failing with no log; this
# uploads the tree directly and gives real logs when something breaks.
name: Deploy deck to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
